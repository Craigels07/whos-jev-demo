    <rect x="1080" y="400" width="420" height="110" rx="16" fill="rgba(58,125,85,0.12)"/>
    <rect x="100" y="400" width="1400" height="110" rx="16" fill="none" stroke="#8C8C8C" stroke-width="5"/>
    <path d="M580 380 V530" fill="none" stroke="#525252" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 12"/>
    <path d="M1080 380 V530" fill="none" stroke="#525252" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 12"/>
    <path d="M830 400 V510" fill="none" stroke="#F386A1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
