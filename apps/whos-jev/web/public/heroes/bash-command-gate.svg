<text x="830" y="105" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#525252" text-anchor="middle">command</text>
    <text x="830" y="148" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="30" font-weight="500" fill="#171717" text-anchor="middle">rm -rf node_modules &amp;&amp; npm install</text>
    <text x="100" y="370" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#525252" text-anchor="start">confidence</text>
